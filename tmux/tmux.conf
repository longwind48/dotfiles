# ============================================
# TMUX Configuration - Best Practices 2025
# ============================================

# ===== IMAGE PASSTHROUGH =====
set -gq allow-passthrough on             # For Neovim image.nvim

# ===== EXTENDED KEYS =====
set -s extended-keys always              # Always pass modifier+key sequences through (needed for shift+enter inside TUIs)
set -as terminal-features 'xterm*:extkeys'
# bind -n S-Enter send-keys Escape Enter   # Disabled - let Shift+Enter pass through to shell

# ===== PREFIX =====
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ===== GENERAL =====
set -sg escape-time 0              # No delay for escape key (critical for vim)
set -g history-limit 50000         # Increase scrollback (default 2000)
set -g mouse on                    # Enable mouse for pane scrolling
set -g focus-events on             # For vim/neovim integration
set -g display-time 3000           # Messages display for 3 seconds

# ===== INDEXING =====
set -g base-index 1                # Start windows at 1
setw -g pane-base-index 1          # Start panes at 1
set -g renumber-windows on         # Renumber windows on close

# ===== VI MODE =====
setw -g mode-keys vi               # Vi keys in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# y binding is handled by tmux-yank plugin for proper clipboard integration

# ===== MOUSE SELECTION =====
# Stay in copy mode when selecting with mouse
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
# Double click to select word
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-no-clear
# Triple click to select line
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection-no-clear

# ===== INTUITIVE SPLITS =====
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ===== VIM-STYLE PANE NAVIGATION =====
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===== PANE RESIZING =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== WINDOW NAVIGATION =====
bind -n M-H previous-window        # Alt+Shift+H
bind -n M-L next-window            # Alt+Shift+L
bind Space last-window             # Toggle last window

# ===== SESSION NAVIGATION =====
bind -n M-s choose-tree -Zs        # Alt+s session picker
bind Tab switch-client -l          # prefix+Tab toggle last session

# ===== RELOAD CONFIG =====
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== 24-BIT COLOR =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"  # undercurl + colored underlines

# ===== STATUS BAR (tmux-dotbar — minimalist, catppuccin mocha) =====
set -g status-position top
set -g @tmux-dotbar-position 'top'
set -g @tmux-dotbar-bg '#1e1e2e'           # mocha base
set -g @tmux-dotbar-fg '#585b70'           # surface2 (inactive windows)
set -g @tmux-dotbar-fg-current '#cdd6f4'   # text (active window)
set -g @tmux-dotbar-fg-session '#9399b2'   # overlay2 (session name)
set -g @tmux-dotbar-fg-prefix '#cba6f7'    # mauve (prefix pressed)
set -g @tmux-dotbar-right 'true'           # show the right side
# Bake the agent-indicator icon into dotbar's right side directly (the literal #()
# the plugin would expand). This survives dotbar overwriting status-right at init.
set -g @tmux-dotbar-status-right '#[bg=#1e1e2e,fg=#9399b2]#(~/.tmux/plugins/tmux-agent-indicator/scripts/indicator.sh) %H:%M '

# ===== PLUGINS =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Session persistence
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'          # System clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless vim navigation
set -g @plugin 'tmux-plugins/tmux-cpu'           # CPU/RAM info
set -g @plugin 'vaaleyard/tmux-dotbar'           # Minimalist status bar theme (loads before agent-indicator)
set -g @plugin 'accessd/tmux-agent-indicator'    # AI agent state (running/needs-input/done)

# ===== AGENT INDICATOR colors (active pane border per state) =====
# The plugin colors the ACTIVE pane border per state; the border bypasses the theme
# and the running color persists on the focused window (done/needs-input clear on focus).
set -g @agent-indicator-icons 'claude=🤖,codex=🧠,opencode=💻,default=🤖'
set -g @agent-indicator-running-border 'colour114'      # green (#a6e3a1) while Claude is working
set -g @agent-indicator-needs-input-border 'colour222'  # yellow when it wants input
set -g @agent-indicator-done-border 'colour114'         # green when finished
# Idle/no-state reverts to the magenta active border set after TPM (below).

# Yank settings (must be before plugin init)
set -g @yank_action 'copy-pipe-no-clear'  # Stay in copy mode after yanking

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'  # Disabled initially - enable after first session save
set -g @continuum-save-interval '15'  # Auto-save every 15 minutes

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Override plugin bindings (must be after TPM init)
# Mouse selection: copy to clipboard but stay in copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
# Keyboard 'y': copy to clipboard and exit copy mode (traditional behavior)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
# Keyboard 'Y': copy to clipboard and stay in copy mode
bind -T copy-mode-vi Y send -X copy-pipe-no-clear

# ===== PANE STYLING (after TPM so plugins can't override) =====
# Dim inactive panes — active pane keeps terminal default bg, inactive panes go darker
set -g window-style        'fg=colour245,bg=#0a0a14'
set -g window-active-style 'fg=default,bg=default'

# Loud active border: bright magenta double line with arrow indicators pointing at active pane
set -g pane-active-border-style 'fg=#ff5fd7,bg=default,bold'
set -g pane-border-style        'fg=colour238,bg=default'
set -g pane-border-lines double
set -g pane-border-indicators both

# Pane title bar — bold magenta ● ACTIVE on the focused one, matching the border
set -g pane-border-status top
set -g pane-border-format ' #[fg=colour245]#{?pane_active,#[fg=#ff5fd7#,bold]● ACTIVE,○ idle} #[fg=colour245]│ #[fg=cyan]#P #[fg=colour245]│ #[fg=colour250]#{pane_current_command} '

# ===== CLAUDE CODE RUNNING → GREEN TAB (after TPM so it overrides dotbar) =====
# dotbar rebuilds window-status-(current-)format at init, so we re-set them here.
# A window whose active pane runs Claude Code AND is WORKING (title is "Claude Code"
# but not the idle "✳" prefix) gets a green (#a6e3a1) tab; otherwise dotbar's colors.
# "working" = title contains "Claude Code" and does NOT start with ✳ (idle marker).
set -g window-status-current-format '#{?#{&&:#{m:*Claude Code*,#{pane_title}},#{!=:#{m:✳*,#{pane_title}},1}},#[bg=#1e1e2e#,fg=#a6e3a1#,bold] #W ,#[bg=#1e1e2e#,fg=#cdd6f4] #W }#[fg=#39BAE6,bg=#1e1e2e]#{?window_zoomed_flag,󰊓,}#[fg=#1e1e2e,bg=default]'
set -g window-status-format '#{?#{&&:#{m:*Claude Code*,#{pane_title}},#{!=:#{m:✳*,#{pane_title}},1}},#[fg=#a6e3a1] #W ,#[fg=#585b70] #W }'

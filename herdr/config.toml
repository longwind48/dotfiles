onboarding = false
[keys]
prefix = "ctrl+space"
# Toggle back to the last-focused pane/agent, globally across tabs and
# workspaces (herdr's equivalent of tmux `prefix+l` last-window).
last_pane = "prefix+space"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[experimental]
pane_history = true
kitty_graphics = true

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "tab-smart-rename.rename-now"
description = "smart rename current tab"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "tab-smart-rename.rename-all"
description = "force smart rename all tabs"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement overlay --focus'
description = "open browser overlay"

[theme]
name = "kanagawa"
auto_switch = false
